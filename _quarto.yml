project:
  type: book

book:
  title: "LiDAR Forestry"
  author: 
    - name: Seamus Murphy
      url: https://scholar.google.com/citations?hl=en&user=jDGq9I4AAAAJ
      orcid: 0000-0002-1792-0351 
      email: seamusrobertmurphy@gmail.com
  date: today
  favicon: ./assets/PNG/favicon.png
  open-graph: true 
  page-footer:
    left: "[Source](https://github.com/seamusrobertmurphy/lidar-forestry)"
    right: |
      [LinkedIn](https://linkedin.com/in/seamusrobertmurphy) | 
      [Resume](https://drive.google.com/uc?export=download&id=13YLhsRCAMMHQw-jd2SJdaRJH9udBGytP) | 
      [Scholar](https://scholar.google.com/citations?hl=en&user=jDGq9I4AAAAJ)

  site-url: https://seamusrobertmurphy.quarto.pub/lidar-forestry/
  repo-url: https://github.com/seamusrobertmurphy/lidar-forestry
  repo-branch: main
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - 01-point-cloud/index.qmd
    - 02-stem-detect/index.qmd
    - 03-canopy-height/index.qmd
    - 04-biomass-model/index.qmd

  appendices:
    - resources/index.qmd
    - references/index.qmd    

bibliography: ./references/references.bib
csl: ./references/apa.csl
citeproc: true  

filters:
  - quarto

sidebar:
    title: "LiDAR Forestry Tools"
    search: true
    style: "floating"
    collapse-level: 4

format:
  html:
    number-depth: 2
    toc-location: right
    toc-depth: 3
    theme: 
      - styles.scss
      - default
    code-fold: false
    code-summary: "Code"
    code-tools: true
    code-link: true
    title-block-style: plain
    knitr:
      opts_chunk:
        out.width: 100%
        R.options:
          width: 68

engine: knitr

knitr:
  opts_chunk: 
    collapse: true
    comment: "#" 
    R.options:
      knitr.graphics.auto_pdf: true
      dplyr.print_min: 6
      dplyr.print_max: 6
      stars.crs: 17
      digits: 3
